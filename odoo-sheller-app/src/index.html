<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Before styles.css: the canvas is white until something says otherwise,
         and a stylesheet is a separate request. -->
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body {
        background: #04030e;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>odoo-sheller</title>
    <!-- @xterm/xterm 5.5.0 and @xterm/addon-fit 0.10.0, vendored; see vendor/VERSION -->
    <link rel="stylesheet" href="vendor/xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      This page is the window. The daemon's UI is framed rather than navigated
      to, because the terminal has to sit in the same window and only a local
      page can reach the Tauri commands — the iframe is a remote origin and
      gets none of them. Nothing here is a copy of that UI, and nothing
      proxies it: the frame loads it from the daemon like any other client.
    -->
    <iframe id="ui" title="odoo-sheller" hidden></iframe>

    <main id="splash">
      <p class="mark">odoo-sheller</p>
      <p class="status" id="status">Starting…</p>
      <div class="actions" id="actions" hidden>
        <button id="retry" type="button">Try again</button>
        <button id="quit" type="button" class="quiet">Quit</button>
      </div>
    </main>

    <section id="dock" class="closed">
      <div id="grip" title="Drag to resize"></div>
      <div id="dock-bar">
        <div id="tabs"></div>
        <button id="new-tab" type="button" title="New terminal tab — ⌘T">+</button>
        <span id="dock-spacer"></span>
        <!-- A prompt, not a keystroke: the shortcut was the whole label and
             said nothing about what the button does. The title still names it. -->
        <button
          id="dock-toggle"
          type="button"
          title="Show or hide the terminal — Ctrl+`"
          aria-label="Show or hide the terminal"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M3.75 4.25 7.25 8l-3.5 3.75" />
            <path d="M8.75 11.75h3.5" />
          </svg>
        </button>
      </div>
      <div id="panes"></div>
    </section>

    <!--
      Settings — MCP, SSH. One skeleton for every section: what differs between
      them is words, and those come with the event. It was a native alert until
      the first snippet outgrew one: proportional text eats the indentation of
      a block, and OK is the only thing an alert lets you press. Nothing here
      is saved — every section is text for a file this app does not own — so
      the way out says Close rather than Done.
    -->
    <!-- About: the same sheet as Settings, because it is the same kind of
         thing — something to read and dismiss, with nothing to save. -->
    <dialog id="about" class="sheet">
      <h2 id="about-name"></h2>
      <p class="tagline" id="about-tagline"></p>
      <div id="about-text"></div>
      <dl class="settings-locations" id="about-facts"></dl>
      <footer>
        <button type="button" id="about-close">Close</button>
      </footer>
    </dialog>

    <dialog id="settings" class="sheet">
      <h2>Settings</h2>
      <nav id="settings-tabs"></nav>
      <div id="settings-panel"></div>
      <footer>
        <button type="button" id="settings-close">Close</button>
      </footer>
    </dialog>

    <script src="vendor/xterm.min.js"></script>
    <script src="vendor/addon-fit.min.js"></script>
    <script src="shell.js"></script>
  </body>
</html>
