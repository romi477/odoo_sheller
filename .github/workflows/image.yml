# Publishes the containerized daemon to GHCR. The package is private on
# purpose: a public GHCR package can be pulled anonymously, which is what this
# image would eventually want, but making one public cannot be undone. Private
# is the choice that closes nothing.
#
# Consumers therefore need `docker login ghcr.io` with a token carrying
# read:packages. That is documented in README.md.

name: image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # A published image is one people pull. The suite is under a minute;
      # shipping past it is not a saving. Same reasoning as desktop-macos.yml
      # running cargo test before it builds.
      - name: Test
        run: uv run pytest -q -m "not e2e and not frozen and not container"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Building twice costs one cached pass and buys the only proof that the
      # thing being pushed runs at all. amd64 alone: the arm64 half differs
      # only in which static CLI tarball it unpacked.
      - name: Build for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: odoo-sheller:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint odoo-sheller odoo-sheller:smoke --help
          docker run --rm --entrypoint python odoo-sheller:smoke -c "import odoo_sheller.mcp"
          if docker run --rm odoo-sheller:smoke; then
              echo "the entrypoint started without a docker socket" >&2
              exit 1
          fi

      - name: Tags
        id: tags
        run: |
          image=ghcr.io/${{ github.repository_owner }}/odoo-sheller
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
              version="${GITHUB_REF_NAME#v}"
              echo "tags=${image}:${version},${image}:latest" >> "$GITHUB_OUTPUT"
          else
              echo "tags=${image}:dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
